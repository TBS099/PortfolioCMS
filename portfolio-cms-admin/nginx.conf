server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback - let React Router handle client-side routes instead of
    # nginx 404ing on a direct hit to e.g. /reset-password
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed build assets (JS/CSS/fonts) are immutable - safe to cache hard.
    # favicon-*.svg live in public/ unhashed, so they're excluded here and
    # fall through to normal (short-lived) caching.
    location ~* ^/assets/.*\.(js|css|woff2?|ttf|eot)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
}
